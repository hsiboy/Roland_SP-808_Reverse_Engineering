;
; H8S.cfg — IDA Pro processor configuration for Renesas H8S family
;
; Covers H8S/2653 (Roland SP-808) and H8S/2655 group.
; All addresses sourced from H8S/2655 Group Hardware Manual
; Renesas REJ09B0331-0500, Rev 5.00, Sep 2006.
;
; H8S/2653 and H8S/2655 share the same internal I/O register map.
; All addresses are lower 16 bits of the full 24-bit address.
; Full address = 0xFF0000 | lower16.
;

.H8S/2655

; ---------------------------------------------------------------------------
; Interrupt controller  (base H'FEC0)
; ---------------------------------------------------------------------------
ICRA           0xFEC0    Interrupt control register A
ICRB           0xFEC1    Interrupt control register B
ICRC           0xFEC2    Interrupt control register C
IPRA           0xFEC4    Interrupt priority register A
IPRB           0xFEC5    Interrupt priority register B
IPRC           0xFEC6    Interrupt priority register C
IPRD           0xFEC7    Interrupt priority register D
IPRE           0xFEC8    Interrupt priority register E
IPRF           0xFEC9    Interrupt priority register F
IPRG           0xFECA    Interrupt priority register G
IPRH           0xFECB    Interrupt priority register H
IPRI           0xFECC    Interrupt priority register I
IPRJ           0xFECD    Interrupt priority register J
IPRK           0xFECE    Interrupt priority register K

; ---------------------------------------------------------------------------
; Bus controller  (base H'FED0)
; ---------------------------------------------------------------------------
ABWCR          0xFED0    Bus width control register
ASTCR          0xFED1    Access state control register
WCRH           0xFED2    Wait control register H
WCRL           0xFED3    Wait control register L
BCRH           0xFED4    Bus control register H (reset H'D0)
BCRL           0xFED5    Bus control register L (reset H'3C)
MCR            0xFED6    Memory control register
DRAMCR         0xFED7    DRAM control register

; ---------------------------------------------------------------------------
; GPIO data direction registers  (base H'FEB0, write-only)
; ---------------------------------------------------------------------------
P1DDR          0xFEB0    Port 1 data direction register (write-only)
P2DDR          0xFEB1    Port 2 DDR (write-only) — bits 0/5/6 drive HC138 A/B/C for DSP CS steering
P3DDR          0xFEB2    Port 3 data direction register (write-only)
P5DDR          0xFEB4    Port 5 data direction register (write-only)
P6DDR          0xFEB5    Port 6 data direction register (write-only)
PADDR          0xFEB9    Port A data direction register (write-only)
PBDDR          0xFEBA    Port B data direction register (write-only)
PCDDR          0xFEBB    Port C data direction register (write-only)
PDDDR          0xFEBC    Port D data direction register (write-only)
PEDDR          0xFEBD    Port E data direction register (write-only)
PFDDR          0xFEBE    Port F data direction register (write-only)
PGDDR          0xFEBF    Port G DDR (write-only) — CS0-CS3; CS3 enables HC138 for DSP decode

; ---------------------------------------------------------------------------
; GPIO data registers  (base H'FF60, read/write output latch)
; ---------------------------------------------------------------------------
P1DR           0xFF60    Port 1 data register
P2DR           0xFF61    Port 2 data register — bits 0/5/6 steer HC138 A/B/C for DSP chip select
P3DR           0xFF62    Port 3 data register
P5DR           0xFF64    Port 5 data register
P6DR           0xFF65    Port 6 data register
PADR           0xFF69    Port A data register
PBDR           0xFF6A    Port B data register
PCDR           0xFF6B    Port C data register
PDDR           0xFF6C    Port D data register
PEDR           0xFF6D    Port E data register
PFDR           0xFF6E    Port F data register
PGDR           0xFF6F    Port G data register — CS0-CS3 chip select outputs

; ---------------------------------------------------------------------------
; GPIO pin state registers  (base H'FF50, read-only)
; ---------------------------------------------------------------------------
PORT1          0xFF50    Port 1 pin state (read-only)
PORT2          0xFF51    Port 2 pin state (read-only)
PORT3          0xFF52    Port 3 pin state (read-only)
PORT4          0xFF53    Port 4 pin state (read-only)
PORT5          0xFF54    Port 5 pin state (read-only)
PORT6          0xFF55    Port 6 pin state (read-only)
PORTA          0xFF59    Port A pin state (read-only)
PORTB          0xFF5A    Port B pin state (read-only)
PORTC          0xFF5B    Port C pin state (read-only)
PORTD          0xFF5C    Port D pin state (read-only)
PORTE          0xFF5D    Port E pin state (read-only)
PORTF          0xFF5E    Port F pin state (read-only)
PORTG          0xFF5F    Port G pin state (read-only)

; ---------------------------------------------------------------------------
; IRQ sense and enable  (base H'FF2C)
; ---------------------------------------------------------------------------
ISCRH          0xFF2C    IRQ sense control register H
ISCRL          0xFF2D    IRQ sense control register L
IER            0xFF2E    IRQ enable register
ISR            0xFF2F    IRQ status register

; ---------------------------------------------------------------------------
; System control  (base H'FF38)
; ---------------------------------------------------------------------------
SBYCR          0xFF38    Standby control register
SYSCR          0xFF39    System control register
SCKCR          0xFF3A    System clock control register
MDCR           0xFF3B    Mode control register (read-only)
MSTPCRH        0xFF3C    Module stop control register H
MSTPCRL        0xFF3D    Module stop control register L

; ---------------------------------------------------------------------------
; Timer pulse unit — start and sync
; ---------------------------------------------------------------------------
TSTR           0xFFC0    Timer start register
TSYR           0xFFC1    Timer synchro register

; ---------------------------------------------------------------------------
; SCI channel 0 — MIDI IN/OUT  (base H'FF78)
; ---------------------------------------------------------------------------
SMR0           0xFF78    SCI0 serial mode register (MIDI)
BRR0           0xFF79    SCI0 bit rate register (MIDI)
SCR0           0xFF7A    SCI0 serial control register (MIDI)
TDR0           0xFF7B    SCI0 transmit data register (MIDI)
SSR0           0xFF7C    SCI0 serial status register (MIDI)
RDR0           0xFF7D    SCI0 receive data register (MIDI)
SCMR0          0xFF7E    SCI0 smart card mode register

; ---------------------------------------------------------------------------
; SCI channel 1  (base H'FF80)
; ---------------------------------------------------------------------------
SMR1           0xFF80    SCI1 serial mode register
BRR1           0xFF81    SCI1 bit rate register
SCR1           0xFF82    SCI1 serial control register
TDR1           0xFF83    SCI1 transmit data register
SSR1           0xFF84    SCI1 serial status register
RDR1           0xFF85    SCI1 receive data register
SCMR1          0xFF86    SCI1 smart card mode register

; ---------------------------------------------------------------------------
; SCI channel 2  (base H'FF88)
; ---------------------------------------------------------------------------
SMR2           0xFF88    SCI2 serial mode register
BRR2           0xFF89    SCI2 bit rate register
SCR2           0xFF8A    SCI2 serial control register
TDR2           0xFF8B    SCI2 transmit data register
SSR2           0xFF8C    SCI2 serial status register
RDR2           0xFF8D    SCI2 receive data register
SCMR2          0xFF8E    SCI2 smart card mode register

; ---------------------------------------------------------------------------
; A/D converter  (base H'FF90)
; ---------------------------------------------------------------------------
ADDRA          0xFF90    A/D data register A (16-bit, read-only)
ADDRB          0xFF92    A/D data register B (16-bit, read-only)
ADDRC          0xFF94    A/D data register C (16-bit, read-only)
ADDRD          0xFF96    A/D data register D (16-bit, read-only)
ADCSR          0xFF98    A/D control/status register
ADCR           0xFF99    A/D control register

; ---------------------------------------------------------------------------
; Flash memory control  (base H'FFA8)
; ---------------------------------------------------------------------------
FLMCR1         0xFFA8    Flash memory control register 1
FLMCR2         0xFFA9    Flash memory control register 2
EBR1           0xFFAA    Erase block register 1
EBR2           0xFFAB    Erase block register 2

; ---------------------------------------------------------------------------
; Alias for H8S/2653 — same register map
; ---------------------------------------------------------------------------
